services:
  postgres:
    container_name: !reset null
    env_file: !reset
      - path: ${APP_ENV_FILE:-.env}
        required: false
    ports: !reset []
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro

  qdrant:
    container_name: !reset null
    image: qdrant/qdrant:v1.18.3
    ports: !reset []
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:6333/readyz', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: !reset null
    ports: !reset []
    volumes:
      - redis_data:/data

  api:
    container_name: !reset null
    image: vgu-admissions-platform-api:${APP_IMAGE_TAG:-prod}
    env_file: !reset
      - path: ${APP_ENV_FILE:-.env}
        required: false
    ports: !reset []
    entrypoint: !reset null
    environment:
      APP_ENV: ${APP_ENV:-production}
      START_EMBEDDED_WORKER: "false"
      OCR_TEMP_DIR: /app/data/runtime/admissions-ocr
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !reset
      - crawl_artifacts:/app/data/runtime/admissions-ocr
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - bash
      - -lc
      - |
        DATABASE_URL="postgresql+psycopg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}" alembic upgrade head &&
        exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_API_UPSTREAM: ${CADDY_API_UPSTREAM:-api:8000}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

  worker:
    profiles: !reset []
    build: .
    image: vgu-admissions-platform-worker:${APP_IMAGE_TAG:-prod}
    restart: unless-stopped
    working_dir: /app
    env_file: !reset
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${APP_DATABASE_USER}:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_URL: redis://redis:6379/0
      OCR_TEMP_DIR: /app/data/runtime/admissions-ocr
      PYTHONPATH: /app
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: !reset
      - crawl_artifacts:/app/data/runtime/admissions-ocr
    command: python /app/worker/start.py
    networks:
      - app-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  crawl_artifacts:
  caddy_data:
  caddy_config:
