services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: vgu-admissions-platform-api:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DATABASE_USER}:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,vgu.edu.vn,www.vgu.edu.vn,tuyensinh.vgu.edu.vn},api
      OCR_TEMP_DIR: ${OCR_TEMP_DIR:-/app/data/runtime/admissions-ocr}
      RUN_EVAL_ON_DEPLOY: "false"
      START_EMBEDDED_WORKER: ${START_EMBEDDED_WORKER:-true}
      WARMUP_FAQ_CACHE: ${WARMUP_FAQ_CACHE:-false}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    entrypoint: ["/bin/bash", "/app/scripts/entrypoint.sh"]
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    networks:
      - app-network

  worker:
    build: .
    image: vgu-admissions-platform-worker:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    working_dir: /app
    profiles:
      - queue
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DATABASE_USER}:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_URL: redis://redis:6379/0
      OCR_TEMP_DIR: ${OCR_TEMP_DIR:-/app/data/runtime/admissions-ocr}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: python /app/worker/start.py
    networks:
      - app-network

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  app-network:
    driver: bridge
