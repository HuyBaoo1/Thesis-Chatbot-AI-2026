services:
  # ============================================================================
  # PostgreSQL — managed by Render
  # ============================================================================
  - type: pserv
    name: vgu-admissions-platform-db
    runtime: image
    image:
      image: postgres:16
    plan: starter
    disk:
      name: vgu-admissions-platform-db-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      - key: POSTGRES_USER
        value: vgu_migration
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: vgu_admissions

  # ============================================================================
  # Redis — managed by Render
  # ============================================================================
  - type: redis
    name: vgu-admissions-platform-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipMask: 0.0.0.0/0

  # ============================================================================
  # FastAPI Web Service
  # ============================================================================
  - type: web
    name: vgu-admissions-platform-api
    runtime: docker
    repo: DATA_REQUIRED
    branch: main
    plan: standard
    healthCheckPath: /health
    # Fix DATABASE_URL for psycopg3 driver before starting
    startCommand: sh -c 'export DATABASE_URL=$(echo "$DATABASE_URL" | sed "s|^postgresql://|postgresql+psycopg://|") && alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4'
    envVars:
      # ---- Database (managed by Render) ----
      - key: DATABASE_URL
        value: DATA_REQUIRED

      # ---- Redis (managed by Render) ----
      - key: REDIS_URL
        fromService:
          name: vgu-admissions-platform-redis
          type: redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: vgu-admissions-platform-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: vgu-admissions-platform-redis
          type: redis
          property: port

      # ---- AI / LLM (verified) ----
      - key: OPENAI_API_KEY
        value: 
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o
      - key: DEFAULT_MODEL
        value: claude-sonnet-4-20250514
      - key: GEMINI_API_KEY
        value:
      - key: GEMINI_ROUTER_MODEL
        value: gemini-3-flash-preview

      # ---- Qdrant Cloud ----
      - key: QDRANT_HOST
        value: DATA_REQUIRED
      - key: QDRANT_PORT
        value: "443"
      - key: QDRANT_HTTPS
        value: "true"
      - key: QDRANT_API_KEY
        value:
      - key: QDRANT_KNOWLEDGE_COLLECTION
        value: knowledge_chunks

      # ---- University identity ----
      - key: UNIVERSITY_NAME
        value: Vietnamese-German University
      - key: UNIVERSITY_SHORT_NAME
        value: VGU
      - key: UNIVERSITY_WEBSITE
        value: https://vgu.edu.vn/
      - key: UNIVERSITY_DOMAIN
        value: vgu.edu.vn

      # ---- Cloudflare R2 ----
      - key: R2_ACCOUNT_ID
        value:
      - key: R2_ACCESS_KEY_ID
        value:
      - key: R2_SECRET_ACCESS_KEY
        value:
      - key: R2_BUCKET_NAME
        value: DATA_REQUIRED
      - key: R2_PUBLIC_BASE_URL
        value: DATA_REQUIRED

      # ---- JWT / Auth ----
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CONVERSATION_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: ALGORITHM
        value: HS256
      - key: COOKIE_SECURE
        value: "true"

      # ---- CORS & Security ----
      # After first deploy, update these with your frontend and backend domains.
      - key: CORS_ALLOW_ORIGINS
        value: DATA_REQUIRED
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: CORS_ALLOW_METHODS
        value: "*"
      - key: CORS_ALLOW_HEADERS
        value: "*"
      - key: TRUSTED_HOSTS
        value: DATA_REQUIRED

      # ---- Rate Limits ----
      - key: CHAT_QUERY_RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: CHAT_QUERY_RATE_LIMIT_PER_HOUR
        value: "120"
      - key: CHAT_QUERY_IP_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: CHAT_INIT_RATE_LIMIT_PER_MINUTE
        value: "10"

      # ---- Bootstrap Admin ----
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: BOOTSTRAP_ADMIN_NAME
        value: System Admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        value:
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value:

      # ---- RQ / Queue ----
      - key: RQ_QUEUE_NAME
        value: vgu-admissions
      - key: RQ_JOB_TIMEOUT
        value: "900"

      # ---- Retention ----
      - key: MESSAGE_CHUNK_USAGE_RETENTION_ENABLED
        value: "true"
      - key: MESSAGE_CHUNK_USAGE_RETENTION_DAYS
        value: "60"
      - key: MESSAGE_CHUNK_USAGE_RETENTION_RUN_HOUR
        value: "3"
      - key: MESSAGE_CHUNK_USAGE_RETENTION_BATCH_SIZE
        value: "1000"
      - key: MESSAGE_CHUNK_USAGE_RETENTION_MAX_BATCHES
        value: "100"

      # ---- OCR ----
      - key: USE_SMART_EXTRACTION
        value: "true"
      - key: ENABLE_VISION_FALLBACK
        value: "true"
      - key: OCR_PIPELINE_VERSION
        value: v2

      # ---- Firecrawl ----
      - key: FIRECRAWL_API_KEY
        value:

      # ---- Feature flags ----
      - key: HANDOFF_AI_FALLBACK_ENABLED
        value: "true"

      # ---- Logging ----
      - key: LOG_LEVEL
        value: INFO

      # ---- Telegram (disabled) ----
      - key: TELEGRAM_POLLING_ENABLED
        value: "false"
